# INTERNAL WORKFLOW - Not for external use.
# Workflows prefixed with `_` are internal to this repository.
#
# Lints workflow YAML and any helper shell scripts shipped with composite
# actions. Surfaces findings as PR review comments on pull requests and as
# check annotations on push.

name: Lint

on:
  push:
    branches: [main]
    paths:
      - '.github/**/*.yaml'
      - '.github/**/*.yml'
      - '.github/**/*.sh'
  pull_request:
    paths:
      - '.github/**/*.yaml'
      - '.github/**/*.yml'
      - '.github/**/*.sh'

# Cancel an in-flight run for the same PR when a new push lands, but never
# cancel pushes to main (so every commit on main gets its own green check).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: reviewdog/action-actionlint@d63ba7532e0942965320cd8d73cbae4c7b3c5283 # v1.73.1
        with:
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_level: error

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: reviewdog/action-shellcheck@0722bbdb0d47f04c1b53b8734d2422ac63a45ec6 # v1.32.1
        with:
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_level: error
          path: .github
          pattern: '*.sh'
