# INTERNAL WORKFLOW - Not for external use.
# Workflows prefixed with `_` are internal to this repository.
#
# Lints workflow YAML and any helper shell scripts shipped with composite
# actions. Surfaces findings as PR review comments on pull requests and as
# check annotations on push.

name: Lint

on:
  push:
    branches: [main]
    paths:
      - '.github/**/*.yaml'
      - '.github/**/*.yml'
      - '.github/**/*.sh'
  pull_request:
    paths:
      - '.github/**/*.yaml'
      - '.github/**/*.yml'
      - '.github/**/*.sh'

# Cancel an in-flight run for the same PR when a new push lands, but never
# cancel pushes to main (so every commit on main gets its own green check).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1.77.0
        with:
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_level: error

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: reviewdog/action-shellcheck@0a90156c6e0553996a217f0a9e09be6b0f6bee4c # v1.34.0
        with:
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_level: error
          path: .github
          pattern: '*.sh'
