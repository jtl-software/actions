# Reusable workflow that opens a draft pull request when a feature branch is
# pushed. Reproduces the GitLab "auto-MR" pattern for repositories that
# migrated from GitLab to GitHub.
#
# Caller responsibility: only the trigger. The workflow declares its own
# permissions, default-branch guard, and runner. No inputs, no secrets.
#
# Example caller workflow:
#
#   name: Auto draft PR
#   on:
#     push:
#       branches-ignore:
#         - main
#         - master
#         - '**/gh-readonly-queue/**'
#       tags-ignore: ['**']
#   jobs:
#     draft-pr:
#       uses: jtl-software/actions/.github/workflows/auto-draft-pr.yaml@<sha>

name: Auto draft PR (reusable)

on:
  workflow_call:

jobs:
  draft-pr:
    name: Auto draft PR
    # Skip on the default branch. Push events for the default branch otherwise
    # would attempt to open a PR from main into main.
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      # Required so `gh pr create --assignee <actor>` can attach an assignee.
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # This reusable workflow runs in the caller's repository context, so
          # repository and ref must be explicit to fetch the script from
          # jtl-software/actions at the same commit as the called workflow.
          repository: jtl-software/actions
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts/auto-draft-pr

      - name: Open draft PR
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: .github/scripts/auto-draft-pr/open-draft-pr.ps1
