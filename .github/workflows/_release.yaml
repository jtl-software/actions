# Runs whenever a `v*` tag is pushed. Two jobs:
#
# 1. `create-release` produces a GitHub Release for the tag with auto-generated
#    notes (PRs since the previous release, grouped by label according to
#    `.github/release.yml`).
# 2. `update-major-tag` force-moves the rolling major-version tag (`v1`, `v2`,
#    ...) to the same commit so consumers that pin `@v1` automatically pick up
#    every compatible release. Skipped for pre-release tags such as
#    `v1.0.0-rc.1`.
#
# Release process:
#
#   git tag v1.2.3
#   git push origin v1.2.3
#
# Or in one command via gh CLI:
#
#   gh release create v1.2.3 --generate-notes
#
# (The `gh release create` path also creates the release directly; this
# workflow then runs a second time and idempotently overwrites the release
# notes - which is fine.)

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create release with auto-generated notes
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          # Pre-release detection: any tag containing a hyphen (v1.0.0-rc.1,
          # v2.0.0-beta.3, ...) is treated as a pre-release and is excluded
          # from "latest release" promotion.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'legacy' }}

  update-major-tag:
    name: Roll major-version tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: create-release
    # Only roll the major tag for strict SemVer releases (vX.Y.Z), never for
    # pre-releases (vX.Y.Z-rc.N) where the major tag should keep pointing at
    # the previous stable release.
    if: ${{ !contains(github.ref_name, '-') }}
    # contents: write is required for GITHUB_TOKEN to create and update git refs
    # via the REST API (gh api --method PATCH/POST repos/.../git/refs).
    permissions:
      contents: write
    steps:
      # Checkout is sparse: only the script directory is fetched. No git history
      # or credentials are needed because the tag update uses the REST API.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/_release

      - name: Force-update major tag
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed via env, not interpolated into the run string, to avoid
          # shell injection (ref_name is attacker-controlled via git push).
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: .github/scripts/_release/update-major-tag.sh "$RELEASE_TAG"
