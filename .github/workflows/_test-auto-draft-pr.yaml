# INTERNAL WORKFLOW - Not for external use.
# Workflows prefixed with `_` are internal to this repository.
#
# This workflow exercises `open-draft-pr.sh` against a mocked `gh` CLI.
# Seven code paths:
#   1. Protected branch -> skip
#   2. Existing open PR -> skip (idempotency)
#   3. Titel-prefix (German) in commit message -> extracted title, PR created
#   4. Title-prefix (English) in commit message -> extracted title, PR created
#   5. No title/Titel prefix -> Draft: <branch> fallback title, PR created
#   6. url_encode: slash in branch name -> percent-encoded in API path
#   7. url_encode: multi-byte UTF-8 in branch name -> byte-wise percent-encoded

name: Test auto-draft-pr

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/auto-draft-pr/**'
      - '.github/workflows/auto-draft-pr.yaml'
      - '.github/workflows/_test-auto-draft-pr.yaml'
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/auto-draft-pr/**'
      - '.github/workflows/auto-draft-pr.yaml'
      - '.github/workflows/_test-auto-draft-pr.yaml'
  workflow_dispatch:

# Cancel an in-flight run for the same PR when a new push lands, but never
# cancel pushes to main (so every commit on main gets its own green check).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-protected-branch-skip:
    name: Protected branch => skip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/auto-draft-pr

      - name: Setup mock gh
        shell: bash
        run: .github/scripts/auto-draft-pr/ghmock.sh

      - name: Run with mocked gh
        shell: bash
        env:
          GH_TOKEN: dummy
          COMMIT_MSG: 'Titel: irrelevant'
          BRANCH: release/1.0
          DEFAULT_BRANCH: master
          ACTOR: test-user
          REPO: owner/repo
          MOCK_PROTECTED: 'true'
          MOCK_EXISTING_PR: ''
        run: .github/scripts/auto-draft-pr/open-draft-pr.sh 2>&1 | tee output.txt > /dev/null

      - name: Assert
        run: |
          set -euo pipefail
          grep -q "Branch 'release/1.0' is protected, skipping" output.txt
          if grep -q "MOCK_PR_CREATE" output.txt; then
            echo "Unexpected: gh pr create was called even though the branch is protected." >&2
            exit 1
          fi

  test-existing-pr-skip:
    name: Existing PR => skip (idempotency)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/auto-draft-pr

      - name: Setup mock gh
        shell: bash
        run: .github/scripts/auto-draft-pr/ghmock.sh

      - name: Run with mocked gh
        shell: bash
        env:
          GH_TOKEN: dummy
          COMMIT_MSG: 'Titel: irrelevant'
          BRANCH: feature/foo
          DEFAULT_BRANCH: master
          ACTOR: test-user
          REPO: owner/repo
          MOCK_PROTECTED: 'false'
          MOCK_EXISTING_PR: '42'
        run: .github/scripts/auto-draft-pr/open-draft-pr.sh 2>&1 | tee output.txt > /dev/null

      - name: Assert
        run: |
          set -euo pipefail
          grep -q "PR #42 already exists for 'feature/foo', skipping" output.txt
          if grep -q "MOCK_PR_CREATE" output.txt; then
            echo "Unexpected: gh pr create was called even though a PR already exists." >&2
            exit 1
          fi

  test-title-from-commit:
    name: Titel-prefix => extracted title, full pr create
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/auto-draft-pr

      - name: Setup mock gh
        shell: bash
        run: .github/scripts/auto-draft-pr/ghmock.sh

      - name: Run with mocked gh
        shell: bash
        env:
          GH_TOKEN: dummy
          COMMIT_MSG: |
            Titel: Add foo support
            Body line ignored.
          BRANCH: feature/foo
          DEFAULT_BRANCH: master
          ACTOR: test-user
          REPO: owner/repo
          MOCK_PROTECTED: 'false'
          MOCK_EXISTING_PR: ''
        run: .github/scripts/auto-draft-pr/open-draft-pr.sh 2>&1 | tee output.txt > /dev/null

      - name: Assert
        run: |
          set -euo pipefail
          grep -q "MOCK_PR_CREATE" output.txt
          grep -q -- "--title Add foo support" output.txt
          grep -q -- "--head feature/foo" output.txt
          grep -q -- "--base master" output.txt
          grep -q -- "--assignee test-user" output.txt

  test-title-english-from-commit:
    name: title-prefix (English) => extracted title
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/auto-draft-pr

      - name: Setup mock gh
        shell: bash
        run: .github/scripts/auto-draft-pr/ghmock.sh

      - name: Run with mocked gh
        shell: bash
        env:
          GH_TOKEN: dummy
          COMMIT_MSG: |
            Title: Add bar support
            Body line ignored.
          BRANCH: feature/bar
          DEFAULT_BRANCH: master
          ACTOR: test-user
          REPO: owner/repo
          MOCK_PROTECTED: 'false'
          MOCK_EXISTING_PR: ''
        run: .github/scripts/auto-draft-pr/open-draft-pr.sh 2>&1 | tee output.txt > /dev/null

      - name: Assert
        run: |
          set -euo pipefail
          grep -q "MOCK_PR_CREATE" output.txt
          grep -q -- "--title Add bar support" output.txt
          grep -q -- "--head feature/bar" output.txt
          grep -q -- "--base master" output.txt
          grep -q -- "--assignee test-user" output.txt

  test-title-fallback:
    name: "No Titel-prefix => Draft: <branch> fallback"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/auto-draft-pr

      - name: Setup mock gh
        shell: bash
        run: .github/scripts/auto-draft-pr/ghmock.sh

      - name: Run with mocked gh
        shell: bash
        env:
          GH_TOKEN: dummy
          COMMIT_MSG: 'Just a regular commit'
          BRANCH: feature/foo
          DEFAULT_BRANCH: master
          ACTOR: test-user
          REPO: owner/repo
          MOCK_PROTECTED: 'false'
          MOCK_EXISTING_PR: ''
        run: .github/scripts/auto-draft-pr/open-draft-pr.sh 2>&1 | tee output.txt > /dev/null

      - name: Assert
        run: |
          set -euo pipefail
          grep -q "MOCK_PR_CREATE" output.txt
          grep -q -- "--title Draft: feature/foo" output.txt

  test-url-encode-slash:
    name: url_encode => slash in branch name is percent-encoded
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/auto-draft-pr

      - name: Setup mock gh
        shell: bash
        run: .github/scripts/auto-draft-pr/ghmock.sh

      - name: Run with a branch name containing a slash
        shell: bash
        env:
          GH_TOKEN: dummy
          COMMIT_MSG: 'Just a regular commit'
          BRANCH: 'feature/foo'
          DEFAULT_BRANCH: master
          ACTOR: test-user
          REPO: owner/repo
          # Marking the branch as protected makes the script exit
          # right after the branches API call. No PR list or create
          # call follows, which keeps this test focused on the URL
          # that url_encode produced.
          MOCK_PROTECTED: 'true'
          MOCK_EXISTING_PR: ''
        run: .github/scripts/auto-draft-pr/open-draft-pr.sh 2>&1 | tee output.txt > /dev/null

      - name: Assert branches API was called with percent-encoded slash
        run: |
          set -euo pipefail
          grep -q "MOCK_GH_API_PATH: repos/owner/repo/branches/feature%2Ffoo" output.txt

  test-url-encode-utf8:
    name: url_encode => UTF-8 in branch name is percent-encoded byte-by-byte
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/auto-draft-pr

      - name: Setup mock gh
        shell: bash
        run: .github/scripts/auto-draft-pr/ghmock.sh

      - name: Run with a branch name containing UTF-8 characters
        shell: bash
        env:
          GH_TOKEN: dummy
          COMMIT_MSG: 'Just a regular commit'
          BRANCH: 'feature/foo-ä'
          DEFAULT_BRANCH: master
          ACTOR: test-user
          REPO: owner/repo
          MOCK_PROTECTED: 'true'
          MOCK_EXISTING_PR: ''
        run: .github/scripts/auto-draft-pr/open-draft-pr.sh 2>&1 | tee output.txt > /dev/null

      - name: Assert branches API was called with byte-wise encoded UTF-8
        run: |
          set -euo pipefail
          # 'ä' in UTF-8 is the byte sequence 0xC3 0xA4, which
          # url_encode turns into the two percent escapes %C3%A4.
          grep -q "MOCK_GH_API_PATH: repos/owner/repo/branches/feature%2Ffoo-%C3%A4" output.txt
