# INTERNAL WORKFLOW - Not for external use.
# Workflows prefixed with `_` are internal to this repository.
#
# This workflow exercises `open-draft-pr.ps1` against a mocked `gh` CLI.
# Four code paths:
#   1. Protected branch -> skip
#   2. Existing open PR -> skip (idempotency)
#   3. Titel-prefix in commit message -> extracted title, PR created
#   4. No Titel-prefix -> Draft: <branch> fallback title, PR created

name: Test auto-draft-pr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-protected-branch-skip:
    name: Protected branch => skip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/auto-draft-pr

      - name: Setup mock gh
        shell: pwsh
        run: .github/scripts/auto-draft-pr/ghmock.ps1

      - name: Run with mocked gh
        shell: pwsh
        env:
          GH_TOKEN: dummy
          COMMIT_MSG: 'Titel: irrelevant'
          BRANCH: release/1.0
          DEFAULT_BRANCH: master
          ACTOR: test-user
          REPO: owner/repo
          MOCK_PROTECTED: 'true'
          MOCK_EXISTING_PR: ''
        run: .github/scripts/auto-draft-pr/open-draft-pr.ps1 *>&1 | Tee-Object -FilePath output.txt | Out-Null

      - name: Assert
        run: |
          set -euo pipefail
          grep -q "Branch 'release/1.0' is protected, skipping" output.txt
          if grep -q "MOCK_PR_CREATE" output.txt; then
            echo "Unexpected: gh pr create was called even though the branch is protected." >&2
            exit 1
          fi

  test-existing-pr-skip:
    name: Existing PR => skip (idempotency)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/auto-draft-pr

      - name: Setup mock gh
        shell: pwsh
        run: .github/scripts/auto-draft-pr/ghmock.ps1

      - name: Run with mocked gh
        shell: pwsh
        env:
          GH_TOKEN: dummy
          COMMIT_MSG: 'Titel: irrelevant'
          BRANCH: feature/foo
          DEFAULT_BRANCH: master
          ACTOR: test-user
          REPO: owner/repo
          MOCK_PROTECTED: 'false'
          MOCK_EXISTING_PR: '42'
        run: .github/scripts/auto-draft-pr/open-draft-pr.ps1 *>&1 | Tee-Object -FilePath output.txt | Out-Null

      - name: Assert
        run: |
          set -euo pipefail
          grep -q "PR #42 already exists for 'feature/foo', skipping" output.txt
          if grep -q "MOCK_PR_CREATE" output.txt; then
            echo "Unexpected: gh pr create was called even though a PR already exists." >&2
            exit 1
          fi

  test-title-from-commit:
    name: Titel-prefix => extracted title, full pr create
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/auto-draft-pr

      - name: Setup mock gh
        shell: pwsh
        run: .github/scripts/auto-draft-pr/ghmock.ps1

      - name: Run with mocked gh
        shell: pwsh
        env:
          GH_TOKEN: dummy
          COMMIT_MSG: |
            Titel: Add foo support
            Body line ignored.
          BRANCH: feature/foo
          DEFAULT_BRANCH: master
          ACTOR: test-user
          REPO: owner/repo
          MOCK_PROTECTED: 'false'
          MOCK_EXISTING_PR: ''
        run: .github/scripts/auto-draft-pr/open-draft-pr.ps1 *>&1 | Tee-Object -FilePath output.txt | Out-Null

      - name: Assert
        run: |
          set -euo pipefail
          grep -q "MOCK_PR_CREATE" output.txt
          grep -q -- "--title Add foo support" output.txt
          grep -q -- "--head feature/foo" output.txt
          grep -q -- "--base master" output.txt
          grep -q -- "--assignee test-user" output.txt

  test-title-fallback:
    name: "No Titel-prefix => Draft: <branch> fallback"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/auto-draft-pr

      - name: Setup mock gh
        shell: pwsh
        run: .github/scripts/auto-draft-pr/ghmock.ps1

      - name: Run with mocked gh
        shell: pwsh
        env:
          GH_TOKEN: dummy
          COMMIT_MSG: 'Just a regular commit'
          BRANCH: feature/foo
          DEFAULT_BRANCH: master
          ACTOR: test-user
          REPO: owner/repo
          MOCK_PROTECTED: 'false'
          MOCK_EXISTING_PR: ''
        run: .github/scripts/auto-draft-pr/open-draft-pr.ps1 *>&1 | Tee-Object -FilePath output.txt | Out-Null

      - name: Assert
        run: |
          set -euo pipefail
          grep -q "MOCK_PR_CREATE" output.txt
          grep -q -- "--title Draft: feature/foo" output.txt
